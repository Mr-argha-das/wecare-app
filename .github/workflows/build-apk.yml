name: Build APK (test build - DEBUG signed)

# ⚠️  Ye workflow sirf TESTING ke liye hai.
#
#     Ye koi keystore use nahi karta, isliye "--release" chunne par bhi
#     APK DEBUG key se signed hota hai. Play Console aise build ko
#     reject kar dega ("signed with a debug certificate").
#
#     Play Store ke liye signed AAB/APK chahiye to ye chalayein:
#         Actions -> "Release Build (signed AAB + APK)"
#     (file: .github/workflows/release.yml, setup: RELEASE.md)
#
# GitHub -> Actions -> "Build APK (test build - DEBUG signed)" -> Run workflow
# Khatm hone par APK run ke "Artifacts" section se download karein.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which build to produce"
        type: choice
        default: release
        options: [release, debug]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name "*.apk" -exec \
            cp {} dist/wecare-${{ github.run_number }}.apk \;
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wecare-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
